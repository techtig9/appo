<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Appo">
  <title>Appo</title>
  <!--
    The Appo mark: a geometric "A".

    Drawn as stroked paths rather than a <text> element, because a text
    element renders in whatever font the viewer happens to have — which
    means the mark is a different shape on a Mac, a Windows box and an
    email client. Paths are identical everywhere.

    Stroke weight is 10% of the viewBox, which keeps the counter open and
    the letter legible at 26px in the sidebar, not just at full size.
  -->
  <defs>
    <linearGradient id="appoMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7CFF"/>
      <stop offset="45%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#appoMark)"/>

  <g stroke="#FFFFFF" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Apex and both legs in one stroke, so the join at the top stays sharp. -->
    <path d="M62 150 L100 54 L138 150"/>
    <!-- Crossbar, set slightly low so the counter reads as a triangle. -->
    <path d="M77 118 L123 118"/>
  </g>
</svg>
