<svg width="480" height="140" viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Appo">
  <title>Appo</title>
  <!--
    Horizontal lockup: the "A" mark plus the wordmark.

    The wordmark is a <text> element with a system font stack. That is a
    deliberate trade-off: converting it to outlines would make it render
    identically everywhere, but it would also make the file unreadable and
    unmaintainable. This lockup is only used on the Privacy and Terms
    pages, where a few pixels of font variation costs nothing. The icon —
    which appears everywhere, at small sizes — is all paths.
  -->
  <defs>
    <linearGradient id="appoMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7CFF"/>
      <stop offset="45%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,10)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#appoMark)"/>
    <g stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M37 90 L60 32 L83 90"/>
      <path d="M46 71 L74 71"/>
    </g>
  </g>

  <text x="142" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#111318">Appo</text>
</svg>
